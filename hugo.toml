baseURL = 'www.voulundarhus.com'
languageCode = 'en-us'
title = "Volundarhus"
theme = "hugo-coder"
languagecode = "en"
defaultcontentlanguage = "en"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[pagination]
pagerSize = 20

[services]
[services.disqus]
#shortname = "yourdiscussshortname"

[markup.highlight]
style = "github-dark"

[params]
  author = "Hunter Mills"
  info = "Data Scientist | ML Engineer | Mentor | Tinkerer"
  description = "Hunter Mills' personal website"
  keywords = "blog,developer,personal"
  avatarurl = "images/Hunter_Mills.png"
  #gravatar = "john.doe@example.com"

  faviconSVG = "images/favicon.svg"
  favicon_32 = "images/favicon-32x32.png"
  favicon_16 = "images/favicon-16x16.png"

  since = 2021

  enableTwemoji = true

  colorScheme = "dark"
  hidecolorschemetoggle = true

  # customCSS = ["css/custom.css"]
  # customSCSS = ["scss/custom.scss"]
  customJS = ["js/mysketch.js","js/p5.min.js" ]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

# Social links
[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/huntermills707/"
[[params.social]]
  name = "LinkedIn"
  icon = "fa-brands fa-linkedin fa-2x"
  weight = 2
  url = "https://linkedin.com/in/hunter-mills"
[[params.social]]
  name = "ORCID"
  icon = "fa-brands fa-orcid fa-2x"
