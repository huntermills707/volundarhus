{{ $title := .Get "title" | default "Try the interactive app" }}
{{ $description := .Get "description" }}
{{ $icon := .Get "icon" | default "fa-dice-d20" }}
{{ $logo := .Get "logo" }}
<a class="app-demo" href="{{ .Get "url" }}" target="_blank" rel="noopener">
  {{ if $logo }}
    <img class="app-demo-logo" src="{{ $logo }}" alt="{{ .Get "logo_alt" }}">
  {{ else }}
    <i class="fa-solid {{ $icon }} app-demo-icon" aria-hidden="true"></i>
  {{ end }}
  <span class="app-demo-text">
    <strong>{{ $title }}</strong>
    <span>{{ $description }}</span>
  </span>
  <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
  <span class="sr-only">(opens in a new tab)</span>
</a>
